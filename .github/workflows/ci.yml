name: CI

on:
  push:
    branches: [main, tranche-2, tranche-3]
  pull_request:
    branches: [main, tranche-2, tranche-3]

jobs:
  contracts:
    name: Rust Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust + wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # --locked enforces the committed Cargo.lock: CI builds the exact dependency
      # graph the contracts were tested against, and fails loudly if the lock is
      # stale rather than silently re-resolving to incompatible versions.
      - name: Test keeper-registry
        run: cargo test --locked -p keeper-registry

      - name: Test nectar-vault
        run: cargo test --locked -p nectar-vault

      - name: Test mock-token
        run: cargo test --locked -p mock-token

      - name: Test liquidation-lab
        run: cargo test --locked -p liquidation-lab

      - name: Build contracts (release + wasm32)
        run: cargo build --locked --target wasm32-unknown-unknown --release

  keeper:
    name: Go Keeper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Matches keeper/go.mod (go 1.24.0); avoids a toolchain auto-download.
          go-version: "1.24"
          cache-dependency-path: keeper/go.sum

      - name: Download modules
        working-directory: keeper
        run: go mod download

      - name: gofmt
        working-directory: keeper
        # Fail if any tracked file isn't formatted. -l prints unformatted
        # filenames to stdout; we want it empty.
        run: |
          DIFF=$(gofmt -l .)
          if [ -n "$DIFF" ]; then
            echo "::error::gofmt found unformatted files:"
            echo "$DIFF"
            echo "Run 'gofmt -w .' from the keeper/ directory and commit."
            exit 1
          fi

      - name: Build
        working-directory: keeper
        run: go build ./...

      - name: Test (with race detector)
        working-directory: keeper
        run: go test -race -count=1 -timeout 60s ./...

  frontend:
    name: Next.js Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        # --ignore-scripts skips native gyp builds for transitive deps like
        # `usb` (pulled in by stellar-wallets-kit's optional Trezor/Ledger
        # support). Hardware wallets aren't used at build time — they
        # negotiate USB via WebUSB in the browser at runtime — so we never
        # actually need the Node-side `usb` binary to compile.
        run: npm ci --ignore-scripts

      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:8080"

  # Soroban security linter. Informational for audit prep — it produces a report
  # artifact and never gates the merge (continue-on-error), since Scout findings
  # are advisory. Runs on a clean Ubuntu toolchain because cargo-scout-audit does
  # not install reliably on mixed local toolchains.
  scout:
    name: Scout (Soroban security scan)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install cargo-scout-audit
        run: cargo install cargo-scout-audit --locked
      - name: Run Scout on the audited contracts
        run: |
          mkdir -p scout-out
          for c in keeper-registry nectar-vault; do
            echo "### Scout: $c" | tee "scout-out/$c.txt"
            ( cd "contracts/$c" && cargo scout-audit 2>&1 ) | tee -a "scout-out/$c.txt" || true
          done
      - name: Upload Scout report
        uses: actions/upload-artifact@v4
        with:
          name: scout-report
          path: scout-out/

  # Test-coverage summary for the two audited contracts (informational).
  coverage:
    name: Contract coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Coverage (keeper-registry + nectar-vault)
        run: cargo llvm-cov --locked -p keeper-registry -p nectar-vault --summary-only
