# Railway service config for the Nectar keeper.
# Deploy from this directory with `railway up` or via the Railway dashboard
# (point it at this repo, root directory: keeper/, builder: Dockerfile).

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "./keeper"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
healthcheckPath = "/healthz"
healthcheckTimeout = 30

# Environment variables — set these in the Railway dashboard, NOT here.
# Addresses below are the Tranche 3 hardened deployment (2026-07-22, current
# — see CLAUDE.md / docs/FACTS.md).
# Required:
#   KEEPER_SECRET   (mark as secret) — operator's Stellar S... key
#   KEEPER_NAME     keeper-alpha (or keeper-beta / keeper-gamma per instance)
#   REGISTRY_CONTRACT  CD33A7IGNCOLVQ4EEINBVMVA7IHWXGN57R6YLE5AJEEKPA6VKC2E4IQD
#   VAULT_CONTRACT     CDOGQY7NAE3BP4Q7RWBCBLW23Z36RNWNDNXX5DWNIEVMFEWP3GVEPXLR
#   USDC_CONTRACT      CBIELTK6YBZJU5UP2WWQEUCYKLPU6AUNZ2BQ4WWFEIE3USCIHMXQDAMA (Circle testnet USDC)
#   BLEND_POOLS        comma-separated ADDR[:mode[:POOL_USDC]] entries, e.g.
#     CCEBVDYM32YNYCVNRXQKDFFPISJJCV557CDZEIRBEE4NCV4KHPQ44HGF:monitor:CAQCFVLOBK5GIULPNZRGATJJMIZL5BSP7X5YJVMGCPTUEPFM4AVSRCJU,CBUBTHATT25SGJWXYWL47XN2J372XAJWTNKZAIKVMBBW6SYOIF6PCK3V:active
#     (TestnetV2 settles Blend-USDC — conversion-guarded; Nectar Sandbox settles
#     the vault's Circle USDC. Legacy BLEND_POOL still honored.)
#   SOROBAN_RPC        https://soroban-testnet.stellar.org:443
#   HORIZON_URL        https://horizon-testnet.stellar.org
#   POLL_INTERVAL      10
#   MIN_PROFIT         1.02
#   API_PORT           8080
#
# Optional:
#   SOROSWAP_ROUTER    CCJUD55AG6W5HAI5LRVNKAE5WDP5XGZBUDS5WNTIVDU7O264UZZE7BRD (enables collateral->USDC swaps + USDC conversion)
#   SLIPPAGE_BPS       100 (max swap slippage AND USDC-conversion par bound; default 100 = 1%)
#   BORROWER_CACHE     path for the persisted borrower index, e.g.
#     /app/state/borrowers.json. Needs a Railway VOLUME mounted at that
#     directory or the file dies with every redeploy; empty (default) disables
#     persistence and each start re-backfills the RPC retention window, which
#     is slower but reaches the identical borrower set.
#   WATCH_ADDRESSES    comma-separated addresses always probed, ADDITIVE to
#     event discovery (normally empty — discovery is the mechanism)
#   FAUCET_SECRET      (mark as secret) testnet USDC faucet treasury key; empty disables
#   FAUCET_AMOUNT      250000000 (stroops per claim; treasury-payment, NOT a mint)
#   FAUCET_COOLDOWN_SECS  3600
#   KNOWN_DEPOSITORS   comma-separated list of depositor addresses to display
